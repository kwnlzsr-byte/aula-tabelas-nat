<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ff329c; padding: 8px 14px; text-align: center; }
  th { background: #ffb3d0; }
  [rowspan] { background: #e4d5ff; }
  [colspan] { background: #48fff9; }
</style>

<body>
    <table>
  <tr>
    <th>Horário</th> <th>Seg</th> <th>Ter</th> <th>Qua</th>
  </tr>
  <tr>
    <td>08:00</td>
    <td rowspan="2">Matemática</td>
    <td>História</td>
    <td>Física</td>
  </tr>
  <tr>
    <td>09:00</td>
    <td>Geografia</td>
    <td>Química</td>
  </tr>
  <tr>
    <td>10:00</td>
    <td colspan="3">Intervalo</td>
  </tr>
</table>
</body>
</html>
